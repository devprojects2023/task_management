<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - DevOps Task App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/auth.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="toast-container" id="toast-container"></div>
  
  <div class="auth-container">
    <div class="auth-box">
      <div class="welcome-box">
        <h1 class="title">
          <span class="welcome">Welcome to</span>
          <span class="dev">Dev</span><span class="ops">Ops</span>
        </h1>
      </div>
      
      <h2 class="auth-title">Welcome Back</h2>
      
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="email">
            <i class="fas fa-envelope"></i> Email Address
          </label>
          <input type="email" 
                 id="email" 
                 name="email" 
                 placeholder="Enter your email"
                 required
                 autocomplete="email">
        </div>
        
        <div class="form-group">
          <label for="password">
            <i class="fas fa-lock"></i> Password
          </label>
          <div class="password-field">
            <input type="password" 
                   id="password" 
                   name="password" 
                   placeholder="Enter your password"
                   required
                   autocomplete="current-password">
            <span class="password-toggle" onclick="togglePasswordVisibility('password')">
              <i class="fas fa-eye"></i>
            </span>
          </div>
        </div>
        
        <div class="auth-links">
          <a href="/forgot-password">Forgot Password?</a>
        </div>
        
        <button type="submit" class="auth-btn">
          <span class="btn-text">Sign In</span>
          <span class="loading-spinner" style="display: none;">
            <i class="fas fa-circle-notch fa-spin"></i>
          </span>
        </button>
        
        <div class="auth-redirect">
          <p>Don't have an account? <a href="/register">Create Account</a></p>
        </div>
      </form>
    </div>
  </div>

  <footer>
    <div class="footer-content">
      <span><i class="fas fa-mobile-alt"></i> +919732457565</span>
      <span><i class="fas fa-envelope"></i> debabrata.devops@gmail.com</span>
      <span><i class="fas fa-globe"></i> <a href="https://onestoptech.co.in" target="_blank">onestoptech.co.in</a></span>
      <span><i class="fas fa-user"></i> <a href="https://debabrata.onestoptech.co.in" target="_blank">Portfolio</a></span>
      <span class="copyright">&copy; 2025 Debabrata Hazra. All rights reserved.</span>
    </div>
  </footer>

  <script src="/auth.js"></script>
</body>
</html>
